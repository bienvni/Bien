print("<h1>Turtle!</h1>")
print("<h2>circles</h2>")
import turtle



screen = turtle.Screen()
screen.bgcolor("black")

fireworks = turtle.Turtle()
fireworks.speed(0)
fireworks.color("red")

number_of_circles = 36

for i in range(number_of_circles):
    fireworks.circle(100)
    fireworks.right(360 / number_of_circles)

fireworks.hideturtle()
screen.mainloop()

screen.update() # Update the screen once drawing is complete
turtle.done() # Keeps the window open until manually closed
